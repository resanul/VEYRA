[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra"
version = "0.3.2"
description = "VEYRA Universal Media Player"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
veyra = "veyra.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: real media/network playback tests requiring the Qt multimedia runtime",
]

[tool.setuptools.packages.find]
where = ["src"]
