name: Player State E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-state:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Syntax check
        run: python -m compileall -q src tests build_entry.py

      - name: Real player state E2E
        run: python -m pytest -q -m e2e tests/test_player_e2e.py
