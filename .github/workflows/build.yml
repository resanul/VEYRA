name: Build VEYRA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]' pyinstaller

      - name: Syntax check
        run: python -m compileall -q src tests build_entry.py runtime/veyra_cs3_runtime.py

      - name: Tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Build Windows EXE
        run: >-
          pyinstaller --noconfirm --clean --windowed --name VEYRA
          --paths src --collect-all PySide6 build_entry.py

      - name: Build CS3 runtime EXE
        run: >-
          pyinstaller --noconfirm --clean --console --onefile
          --name veyra-cs3-runtime --paths src runtime/veyra_cs3_runtime.py

      - name: Assemble Windows package
        shell: pwsh
        run: |
          Copy-Item 'dist/veyra-cs3-runtime.exe' 'dist/VEYRA/veyra-cs3-runtime.exe' -Force
          if (-not (Test-Path 'dist/VEYRA/VEYRA.exe')) {
            Write-Error 'VEYRA.exe was not produced.'
          }
          if (-not (Test-Path 'dist/VEYRA/veyra-cs3-runtime.exe')) {
            Write-Error 'veyra-cs3-runtime.exe was not produced.'
          }
          Get-Item 'dist/VEYRA/VEYRA.exe', 'dist/VEYRA/veyra-cs3-runtime.exe' |
            Format-Table FullName,Length

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $result = & 'dist/VEYRA/veyra-cs3-runtime.exe' 2>$null | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CS3 runtime exited with code $LASTEXITCODE"
          }
          if (-not $result) {
            Write-Error 'CS3 runtime produced no protocol response.'
          }
          $response = $result | ConvertFrom-Json
          if ($response.protocol -ne 1 -or $response.ok -ne $true) {
            Write-Error "Unexpected CS3 runtime health response: $result"
          }

      - name: Package Windows artifact
        shell: pwsh
        run: Compress-Archive -Path 'dist/VEYRA/*' -DestinationPath 'dist/VEYRA-Windows-x64.zip' -Force

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: veyra-wheel
          path: dist/*.whl

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: veyra-windows-x64
          path: dist/VEYRA-Windows-x64.zip
          if-no-files-found: error
