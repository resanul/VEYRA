name: Download E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Download E2E
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Download E2E
        run: python -m pytest -q -m e2e tests/test_download_e2e.py
