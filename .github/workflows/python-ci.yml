name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[test]'

      - name: Syntax check
        run: python -m compileall -q src tests build_entry.py

      - name: Unit tests
        run: python -m pytest -q -m "not e2e"
